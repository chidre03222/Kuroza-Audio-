<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KUROZA | Official Catalogue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f9fafb;
      --border: #e5e7eb;
      --accent: #000000;
      --text: #111827;
      --muted: #6b7280;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text); }

    /* BARRA SUPERIOR LIMPIA */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border);
    }

    .brand-logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 3px;
      cursor: pointer; /* Haz clic aquí para activar el acceso secreto */
      user-select: none;
    }

    /* EL BOTÓN DE PUBLICAR Y EL ESTADO SOLO SE VEN SI ESTÁS LOGUEADO */
    #admin-toolbar {
      display: none; /* Oculto por defecto para el público */
      align-items: center;
      gap: 1rem;
    }

    .btn-action {
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .btn-logout {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.5rem 0.8rem;
      border-radius: 4px;
      font-size: 0.7rem;
      cursor: pointer;
    }

    /* MODAL DE AUTENTICACIÓN / CREACIÓN */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 1rem;
    }

    .modal-card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 8px;
      width: 100%;
      max-width: 480px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .close-btn {
      position: absolute;
      top: 1rem; right: 1rem;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--muted);
    }

    .form-group { margin-bottom: 1.2rem; }
    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.4rem;
    }
    .form-group input {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      outline: none;
    }

    .btn-full {
      width: 100%;
      padding: 1rem;
      background: var(--accent);
      color: #ffffff;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    /* FOOTER DISCRETO */
    footer {
      text-align: center;
      padding: 3rem 1rem 1.5rem;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .secret-dot {
      cursor: pointer;
      opacity: 0.3;
      margin-left: 5px;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <!-- Al hacer clic en el título se abre la contraseña secreta -->
    <div class="brand-logo" id="secret-trigger">KUROZA</div>
    
    <!-- BARRA PRIVADA: SOLO VISIBLE SI INICIASTE SESIÓN -->
    <div id="admin-toolbar">
      <button class="btn-action" id="open-upload-btn">+ Publicar Beat</button>
      <button class="btn-logout" id="logout-btn">Salir</button>
    </div>
  </header>

  <!-- CATÁLOGO PÚBLICO -->
  <main style="padding: 3rem 1.5rem; max-width: 1200px; margin: 0 auto;">
    <section style="text-align: center; margin-bottom: 3.5rem;">
      <h1 style="font-size: 2.2rem; letter-spacing: 4px; text-transform: uppercase;">Official Catalogue</h1>
      <p style="color: var(--muted); font-size: 0.85rem; letter-spacing: 1px; margin-top: 0.5rem;">BEATS & PRODUCTION BY KUROZA</p>
    </section>

    <div id="beats-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem;">
      <p style="text-align: center; grid-column: 1/-1; color: var(--muted);">Cargando catálogo...</p>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <p>© 2026 KUROZA AUDIO. ALL RIGHTS RESERVED. <span class="secret-dot" id="secret-dot">•</span></p>
  </footer>

  <!-- MODAL DE LOGIN SECRETO -->
  <div id="login-modal" class="modal-overlay">
    <div class="modal-card">
      <span class="close-btn" id="close-login">&times;</span>
      <h2 style="font-size: 1.2rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 0.5rem;">Acceso Privado</h2>
      <p style="font-size: 0.8rem; color: var(--muted); margin-bottom: 1.5rem;">Ingresa para gestionar tu catálogo.</p>
      
      <form id="login-form">
        <div class="form-group">
          <label>Email Admin</label>
          <input type="email" id="login-email" placeholder="kuroza@outlook.es" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-pass" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-full">Authenticate</button>
      </form>
    </div>
  </div>

  <!-- MODAL DE SUBIR BEAT (SOLO ACCESIBLE CON TU SESIÓN) -->
  <div id="upload-modal" class="modal-overlay">
    <div class="modal-card">
      <span class="close-btn" id="close-upload">&times;</span>
      <h2 style="font-size: 1.2rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 0.5rem;">Upload New Beat</h2>
      <p style="font-size: 0.8rem; color: var(--muted); margin-bottom: 1.5rem;">Publicación automática en tu catálogo público.</p>
      
      <form id="upload-form">
        <div class="form-group">
          <label>Título del Beat</label>
          <input type="text" id="beat-title" placeholder="e.g. SHINOBI" required />
        </div>
        <div class="form-group">
          <label>Género / Estilo</label>
          <input type="text" id="beat-genre" placeholder="e.g. Dancehall / Urban" required />
        </div>
        <div class="form-group">
          <label>BPM & Key</label>
          <input type="text" id="beat-bpmkey" placeholder="e.g. 140 BPM - F# Minor" required />
        </div>
        <div class="form-group">
          <label>URL Imagen de Portada</label>
          <input type="url" id="beat-cover" placeholder="https://..." required />
        </div>
        <div class="form-group">
          <label>Link Audio MP3 o YouTube Video ID</label>
          <input type="text" id="beat-audio" placeholder="Link MP3 o ID YouTube (ej. dQw4w9WgXcQ)" required />
        </div>
        <button type="submit" class="btn-full">Publicar Beat Now</button>
      </form>
    </div>
  </div>

  <!-- FIREBASE SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAOgnePUKfomaD32xGEonJ_DDnfwNpNzmQ",
      authDomain: "kuroza-app.firebaseapp.com",
      projectId: "kuroza-app",
      storageBucket: "kuroza-app.firebasestorage.app",
      messagingSenderId: "967232879538",
      appId: "1:967232879538:web:970f4312098cfbb23f02ab"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // DOM Elements
    const secretTrigger = document.getElementById('secret-trigger');
    const secretDot = document.getElementById('secret-dot');
    const loginModal = document.getElementById('login-modal');
    const uploadModal = document.getElementById('upload-modal');
    const adminToolbar = document.getElementById('admin-toolbar');
    const openUploadBtn = document.getElementById('open-upload-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const beatsContainer = document.getElementById('beats-container');

    // MÉTODOS SECRETOS PARA ABRIR LOGIN (Haz clic en KUROZA o en el punto del footer)
    secretTrigger.addEventListener('click', () => { if(!auth.currentUser) loginModal.style.display = 'flex'; });
    secretDot.addEventListener('click', () => { if(!auth.currentUser) loginModal.style.display = 'flex'; });

    // CERRAR MODALES
    document.getElementById('close-login').addEventListener('click', () => loginModal.style.display = 'none');
    document.getElementById('close-upload').addEventListener('click', () => uploadModal.style.display = 'none');
    openUploadBtn.addEventListener('click', () => uploadModal.style.display = 'flex');

    // DETECTAR SI ERES TÚ (SESIÓN ACTIVA)
    auth.onAuthStateChanged((user) => {
      if (user) {
        // SI INICIASTE SESIÓN: Muestra el botón de publicar arriba
        adminToolbar.style.display = 'flex';
        loginModal.style.display = 'none';
      } else {
        // PARA EL PÚBLICO: Oculta todo el panel de administración
        adminToolbar.style.display = 'none';
      }
    });

    // INICIAR SESIÓN
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-pass').value;

      auth.signInWithEmailAndPassword(email, pass)
        .then(() => {
          loginModal.style.display = 'none';
          alert("¡Acceso concedido, Maestro!");
        })
        .catch(err => alert("Acceso denegado: " + err.message));
    });

    // CERRAR SESIÓN
    logoutBtn.addEventListener('click', () => {
      auth.signOut();
      alert("Sesión cerrada.");
    });

    // SUBIR BEAT A FIRESTORE
    document.getElementById('upload-form').addEventListener('submit', (e) => {
      e.preventDefault();

      const newBeat = {
        title: document.getElementById('beat-title').value,
        genre: document.getElementById('beat-genre').value,
        bpmkey: document.getElementById('beat-bpmkey').value,
        cover: document.getElementById('beat-cover').value,
        audio: document.getElementById('beat-audio').value,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      db.collection('beats').add(newBeat).then(() => {
        alert("¡Beat publicado exitosamente!");
        document.getElementById('upload-form').reset();
        uploadModal.style.display = 'none';
      }).catch(err => alert("Error al subir: " + err.message));
    });

    // CARGAR BEATS AUTOMÁTICAMENTE PARA TODO EL MUNDO
    db.collection('beats').orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
      beatsContainer.innerHTML = '';
      if (snapshot.empty) {
        beatsContainer.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--muted);">Próximamente nuevos lanzamientos.</p>';
        return;
      }

      snapshot.forEach(doc => {
        const beat = doc.data();
        const card = document.createElement('div');
        card.style.cssText = "border: 1px solid var(--border); border-radius: 8px; padding: 1.2rem; background: var(--surface); text-align: center;";
        card.innerHTML = `
          <img src="${beat.cover}" alt="${beat.title}" style="width: 100%; height: 220px; object-fit: cover; border-radius: 6px; margin-bottom: 1rem;">
          <h3 style="font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px;">${beat.title}</h3>
          <p style="font-size: 0.8rem; color: var(--muted); font-weight: 700; margin: 0.4rem 0 1rem;">${beat.genre} | ${beat.bpmkey}</p>
          <div>
            ${beat.audio.includes('http') 
              ? `<audio controls src="${beat.audio}" style="width: 100%;"></audio>`
              : `<iframe width="100%" height="160" src="https://www.youtube.com/embed/${beat.audio}" frameborder="0" allowfullscreen style="border-radius:6px;"></iframe>`
            }
          </div>
        `;
        beatsContainer.appendChild(card);
      });
    });
  </script>
</body>
</html>
