<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KUROZA | Chino The Architect</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="top-contact-bar">
    <span>✉️ kuroza@outlook.es</span>
    <span>📞 +506 8758 5146</span>
  </div>

  <header>
    <a href="#" class="logo">KUROZA</a>
    <div class="header-actions">
      <button id="open-cart-btn" class="btn-cart-toggle">🛒 Carrito (<span id="cart-count">0</span>)</button>
      <div id="admin-bar" style="display:none;">
        <button id="open-upload-btn" class="btn-admin-act">+ Panel</button>
      </div>
    </div>
  </header>

  <section id="beats">
    <div id="beats-container" class="beats-stack-container"></div>
  </section>

  <!-- MODAL CARRITO -->
  <div id="cart-modal" class="modal-overlay">
    <div class="modal-card">
      <span class="close-btn" id="close-cart">&times;</span>
      <h2>Tu Carrito</h2>
      <div id="cart-items-container"></div>
      <div class="total-cart">Total: $<span id="cart-total">0</span></div>
      <button id="checkout-whatsapp-btn" class="btn-full">Enviar pedido por WhatsApp</button>
    </div>
  </div>

  <!-- FIREBASE SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = { 
      apiKey: "AIzaSyAOgnePUKfomaD32xGEonJ_DDnfwNpNzmQ", 
      authDomain: "kuroza-app.firebaseapp.com", 
      projectId: "kuroza-app", 
      storageBucket: "kuroza-app.firebasestorage.app", 
      messagingSenderId: "967232879538", 
      appId: "1:967232879538:web:970f4312098cfbb23f02ab" 
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Inicializar Carrito
    let cart = JSON.parse(localStorage.getItem('kuroza_cart')) || [];
    
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('open-cart-btn').addEventListener('click', () => {
            document.getElementById('cart-modal').style.display = 'flex';
            openCartModal();
        });
        
        document.getElementById('close-cart').addEventListener('click', () => {
            document.getElementById('cart-modal').style.display = 'none';
        });

        document.getElementById('checkout-whatsapp-btn').addEventListener('click', () => {
            sendWhatsAppOrder();
        });

        updateCartCount();
        loadBeats();
    });

    function updateCartCount() {
        document.getElementById('cart-count').innerText = cart.length;
        localStorage.setItem('kuroza_cart', JSON.stringify(cart));
    }

    function openCartModal() {
        const container = document.getElementById('cart-items-container');
        container.innerHTML = cart.length === 0 ? '<p>Tu carrito está vacío</p>' : '';
        let total = 0;
        
        cart.forEach((item, i) => {
            total += Number(item.price);
            container.innerHTML += `
              <div class="cart-item-row" style="display:flex; justify-content:space-between; margin-bottom:10px; align-items:center;">
                <span>${item.title} - $${item.price}</span>
                <button onclick="removeFromCart(${i})" style="background:red; color:white; border:none; padding:4px 8px; cursor:pointer; border-radius:4px;">X</button>
              </div>`;
        });
        document.getElementById('cart-total').innerText = total;
    }

    window.removeFromCart = function(index) {
        cart.splice(index, 1);
        updateCartCount();
        openCartModal();
    }

    window.addToCart = function(title, price) {
        cart.push({ title, price });
        updateCartCount();
        alert(`¡${title} agregado al carrito!`);
    }

    function sendWhatsAppOrder() {
        if (cart.length === 0) {
            alert("Agrega al menos un beat para hacer el pedido.");
            return;
        }
        let message = "¡Hola Chino! Quiero comprar los siguientes beats:\n\n";
        let total = 0;
        cart.forEach(item => {
            message += `- ${item.title}: $${item.price}\n`;
            total += Number(item.price);
        });
        message += `\nTotal a pagar: $${total}`;
        
        const phone = "50687585146";
        const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
        window.open(url, '_blank');
    }

    // Cargar Beats desde Firestore
    function loadBeats() {
        const container = document.getElementById('beats-container');
        container.innerHTML = '<p style="text-align:center; color:#888;">Cargando beats...</p>';

        db.collection('beats').get().then((querySnapshot) => {
            container.innerHTML = '';
            if (querySnapshot.empty) {
                container.innerHTML = '<p style="text-align:center; color:#888;">No hay beats disponibles por ahora.</p>';
                return;
            }

            querySnapshot.forEach((doc) => {
                const beat = doc.data();
                const beatElement = document.createElement('div');
                beatElement.className = 'beat-card';
                beatElement.style.cssText = "background:#111; padding:15px; margin-bottom:15px; border-radius:8px; display:flex; justify-content:space-between; align-items:center;";
                
                beatElement.innerHTML = `
                    <div>
                        <h3 style="color:#fff; margin:0 0 5px 0;">${beat.title || 'Sin título'}</h3>
                        <p style="color:#aaa; margin:0;">BPM: ${beat.bpm || 'N/A'} | Key: ${beat.key || 'N/A'}</p>
                    </div>
                    <div>
                        <span style="color:#0f0; font-weight:bold; margin-right:15px;">$${beat.price || 0}</span>
                        <button onclick="addToCart('${beat.title || 'Beat'}', ${beat.price || 0})" style="background:#25D366; color:#fff; border:none; padding:8px 12px; border-radius:5px; cursor:pointer;">Comprar</button>
                    </div>
                `;
                container.appendChild(beatElement);
            });
        }).catch((error) => {
            console.error("Error al cargar los beats: ", error);
            container.innerHTML = '<p style="text-align:center; color:red;">Error al cargar los beats desde la base de datos.</p>';
        });
    }
  </script>
</body>
</html>
