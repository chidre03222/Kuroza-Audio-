<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KUROZA | Official Catalogue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    /* Estilos del botón de Admin y Ventanas Modales */
    .admin-trigger-btn {
      background: transparent;
      border: 1px solid var(--border, #e5e7eb);
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.3s;
    }
    .admin-trigger-btn:hover {
      background: #000000;
      color: #ffffff;
    }

    /* Modal emergente */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 1rem;
    }
    .modal-card {
      background: #ffffff;
      padding: 2rem;
      border-radius: 8px;
      width: 100%;
      max-width: 480px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      color: #111827;
    }
    .close-modal {
      position: absolute;
      top: 1rem; right: 1rem;
      font-size: 1.2rem;
      cursor: pointer;
      font-weight: bold;
    }
    .admin-form-group {
      margin-bottom: 1rem;
    }
    .admin-form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }
    .admin-form-group input {
      width: 100%;
      padding: 0.7rem;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      outline: none;
    }
    .btn-submit-admin {
      width: 100%;
      padding: 0.8rem;
      background: #000000;
      color: #ffffff;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .status-badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      font-size: 0.7rem;
      background: #e5e7eb;
      border-radius: 12px;
      margin-left: 0.5rem;
    }
  </style>
</head>
<body>

  <!-- BARRA DE NAVEGACIÓN -->
  <header style="display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 2rem; border-bottom: 1px solid #e5e7eb;">
    <div class="logo">
      <h2 style="font-weight: 800; letter-spacing: 2px;">KUROZA</h2>
    </div>
    <nav style="display: flex; align-items: center; gap: 1rem;">
      <button id="open-admin-btn" class="admin-trigger-btn">🔒 Admin Panel</button>
      <span id="admin-status" class="status-badge" style="display:none;">Sesión Activa</span>
    </nav>
  </header>

  <!-- SECCIÓN PRINCIPAL / CATÁLOGO DE BEATS -->
  <main style="padding: 2rem; max-width: 1200px; margin: 0 auto;">
    <section class="hero" style="text-align: center; margin-bottom: 3rem;">
      <h1 style="font-size: 2.5rem; letter-spacing: 3px; text-transform: uppercase;">Official Catalogue</h1>
      <p style="color: #6b7280;">BEATS & PRODUCTION BY KUROZA</p>
    </section>

    <!-- AQUÍ SE CARGAN LOS BEATS AUTOMÁTICAMENTE DE FIREBASE -->
    <div id="beats-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem;">
      <p style="text-align: center; grid-column: 1/-1;">Cargando catálogo oficial...</p>
    </div>
  </main>

  <!-- MODAL DE LOGIN / SUBIDA DE BEATS -->
  <div id="admin-modal" class="modal-overlay">
    <div class="modal-card">
      <span id="close-modal-btn" class="close-modal">&times;</span>

      <!-- FORMULARIO 1: LOGIN -->
      <div id="modal-login-section">
        <h3 style="margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 1px;">Acceso Privado</h3>
        <p style="font-size: 0.8rem; color: #6b7280; margin-bottom: 1.5rem;">Ingresa tus credenciales para gestionar canciones.</p>
        <form id="quick-login-form">
          <div class="admin-form-group">
            <label>Correo</label>
            <input type="email" id="modal-email" placeholder="kuroza@outlook.es" required />
          </div>
          <div class="admin-form-group">
            <label>Contraseña</label>
            <input type="password" id="modal-pass" placeholder="••••••••" required />
          </div>
          <button type="submit" class="btn-submit-admin">Iniciar Sesión</button>
        </form>
      </div>

      <!-- FORMULARIO 2: AGREGAR NUEVO BEAT (Se activa al iniciar sesión) -->
      <div id="modal-upload-section" style="display: none;">
        <h3 style="margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 1px;">+ Agregar Nuevo Beat</h3>
        <p style="font-size: 0.8rem; color: #6b7280; margin-bottom: 1.5rem;">Se publicará automáticamente en la página principal.</p>
        <form id="quick-upload-form">
          <div class="admin-form-group">
            <label>Título del Beat</label>
            <input type="text" id="beat-title" placeholder="e.g. SHINOBI" required />
          </div>
          <div class="admin-form-group">
            <label>Género / Estilo</label>
            <input type="text" id="beat-genre" placeholder="e.g. Dancehall / Reggaeton" required />
          </div>
          <div class="admin-form-group">
            <label>BPM & Key</label>
            <input type="text" id="beat-bpmkey" placeholder="e.g. 140 BPM - F# Minor" required />
          </div>
          <div class="admin-form-group">
            <label>URL Imagen de Portada (Cover Art)</label>
            <input type="url" id="beat-cover-url" placeholder="https://..." required />
          </div>
          <div class="admin-form-group">
            <label>Link de Audio MP3 o YouTube ID</label>
            <input type="text" id="beat-audio-url" placeholder="Link MP3 o ID de YouTube (dQw4w9WgXcQ)" required />
          </div>
          <button type="submit" class="btn-submit-admin">Publicar en la Web</button>
          <button type="button" id="logout-modal-btn" style="width: 100%; margin-top: 0.5rem; background: transparent; border: none; color: #6b7280; cursor: pointer; font-size: 0.75rem;">Cerrar Sesión</button>
        </form>
      </div>

    </div>
  </div>

  <!-- FIREBASE SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAOgnePUKfomaD32xGEonJ_DDnfwNpNzmQ",
      authDomain: "kuroza-app.firebaseapp.com",
      projectId: "kuroza-app",
      storageBucket: "kuroza-app.firebasestorage.app",
      messagingSenderId: "967232879538",
      appId: "1:967232879538:web:970f4312098cfbb23f02ab"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Elementos del DOM
    const openAdminBtn = document.getElementById('open-admin-btn');
    const closeAdminBtn = document.getElementById('close-modal-btn');
    const adminModal = document.getElementById('admin-modal');
    const loginSection = document.getElementById('modal-login-section');
    const uploadSection = document.getElementById('modal-upload-section');
    const adminStatus = document.getElementById('admin-status');
    const beatsContainer = document.getElementById('beats-container');

    // Abrir/Cerrar Modal
    openAdminBtn.addEventListener('click', () => adminModal.style.display = 'flex');
    closeAdminBtn.addEventListener('click', () => adminModal.style.display = 'none');

    // Escuchar Autenticación
    auth.onAuthStateChanged((user) => {
      if (user) {
        loginSection.style.display = 'none';
        uploadSection.style.display = 'block';
        adminStatus.style.display = 'inline-block';
        openAdminBtn.textContent = '⚡ Publicar Beat';
      } else {
        loginSection.style.display = 'block';
        uploadSection.style.display = 'none';
        adminStatus.style.display = 'none';
        openAdminBtn.textContent = '🔒 Admin Panel';
      }
    });

    // Iniciar Sesión
    document.getElementById('quick-login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('modal-email').value;
      const pass = document.getElementById('modal-pass').value;

      auth.signInWithEmailAndPassword(email, pass)
        .catch(err => alert("Error: " + err.message));
    });

    // Cerrar Sesión
    document.getElementById('logout-modal-btn').addEventListener('click', () => auth.signOut());

    // Publicar Beat en Firestore
    document.getElementById('quick-upload-form').addEventListener('submit', (e) => {
      e.preventDefault();

      const newBeat = {
        title: document.getElementById('beat-title').value,
        genre: document.getElementById('beat-genre').value,
        bpmkey: document.getElementById('beat-bpmkey').value,
        cover: document.getElementById('beat-cover-url').value,
        audio: document.getElementById('beat-audio-url').value,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      db.collection('beats').add(newBeat).then(() => {
        alert("¡Beat publicado con éxito en la página principal!");
        document.getElementById('quick-upload-form').reset();
        adminModal.style.display = 'none';
      }).catch(err => alert("Error al guardar: " + err.message));
    });

    // Cargar Catálogo en Tiempo Real
    db.collection('beats').orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
      beatsContainer.innerHTML = '';
      if (snapshot.empty) {
        beatsContainer.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">No hay beats publicados aún. ¡Usa el panel de Admin para agregar el primero!</p>';
        return;
      }

      snapshot.forEach(doc => {
        const beat = doc.data();
        const card = document.createElement('div');
        card.style.cssText = "border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem; background: #fafafa; text-align: center;";
        card.innerHTML = `
          <img src="${beat.cover}" alt="${beat.title}" style="width: 100%; height: 200px; object-fit: cover; border-radius: 6px; margin-bottom: 0.8rem;">
          <h3 style="font-size: 1.1rem; text-transform: uppercase;">${beat.title}</h3>
          <p style="font-size: 0.8rem; color: #6b7280; font-weight: bold;">${beat.genre} | ${beat.bpmkey}</p>
          <div style="margin-top: 1rem;">
            ${beat.audio.includes('http') 
              ? `<audio controls src="${beat.audio}" style="width: 100%;"></audio>`
              : `<iframe width="100%" height="150" src="https://www.youtube.com/embed/${beat.audio}" frameborder="0" allowfullscreen style="border-radius:6px;"></iframe>`
            }
          </div>
        `;
        beatsContainer.appendChild(card);
      });
    });
  </script>
</body>
</html>
